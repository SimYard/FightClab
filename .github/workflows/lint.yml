name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # default_language_version in .pre-commit-config.yaml
      - uses: pre-commit/action@v3.0.1
